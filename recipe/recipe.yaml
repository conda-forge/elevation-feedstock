schema_version: 1

context:
  name: elevation
  version: "1.1.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/elevation-${{ version }}.tar.gz
  sha256: 0e68778edf43110ad6a62ca491e32d9f4d1a59c41a720688ff0066ee1de87293

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - eio=elevation.cli:eio

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=42
    - wheel
    - setuptools_scm >=3.4
    - setuptools_scm_git_archive
    - pip
  run:
    - python >=${{ python_min }}
    - appdirs
    - click
    - fasteners

tests:
  - python:
      imports:
        - elevation
      pip_check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - eio --help

about:
  homepage: https://github.com/bopen/elevation
  license: Apache-2.0
  license_file: LICENSE
  summary: Python script to download global terrain digital elevation models, SRTM 30m DEM and SRTM 90m DEM
  documentation: http://elevation.bopen.eu

extra:
  recipe-maintainers:
    - ocefpaf
    - thewchan
