schema_version: 1

context:
  name: elevation
  version: 2.1.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/elevation-${{ version }}.tar.gz
  sha256: bb6f013a6dc6dea769c1cbc2f36f4007073a39a3c5d329de58124bea82377dc0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - eio = elevation.__main__:app

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77
    - setuptools-scm >=8
    - pip
  run:
    - python >=${{ python_min }}
    - fasteners >=0.18
    - platformdirs >=2.6.0
    - click >=8.1
tests:
  - python:
      imports:
        - elevation
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - eio --help

about:
  homepage: https://github.com/bopen/elevation
  license: Apache-2.0
  license_file: LICENSE
  summary: Python script to download global terrain digital elevation models, SRTM 30m DEM and SRTM 90m DEM
  documentation: http://elevation.bopen.eu

extra:
  recipe-maintainers:
    - ocefpaf
    - thewchan
